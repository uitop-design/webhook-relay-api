name: webhook-relay-api

x-app: &app
  build: .
  image: webhook-relay-api:latest
  restart: unless-stopped
  extra_hosts:
    - host.docker.internal:host-gateway
  environment: &app-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks
    REDIS_URL: redis://redis:6379
    ALLOW_PRIVATE_URLS: 'true'
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
    RETRY_BASE_MS: ${RETRY_BASE_MS:-2000}
    DELIVERY_TIMEOUT_MS: ${DELIVERY_TIMEOUT_MS:-5000}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
    RECOVERY_INTERVAL_MS: ${RECOVERY_INTERVAL_MS:-15000}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      - '5438:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webhooks -d webhooks']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6383:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    restart: 'no'
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/db/seed.js']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'dist/server.js']
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: 3500
    ports:
      - '3500:3500'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3500/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
